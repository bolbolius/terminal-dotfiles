# Starship Configuration
# Aesthetic: Modern Sleek Pill / Subtle Capsule Layout with Tokyo Night Palette

command_timeout = 400
scan_timeout = 20
add_newline = true
palette = "tokyo_night"

format = """
$os$container$env_var$directory$git_branch$git_state$git_status\
$golang$python$nodejs$terraform$kubernetes$docker_context$jobs\
$fill$hostname$username$time\
$line_break\
$cmd_duration$status$character"""

[fill]
symbol = " "

# --- Palette ---
[palettes.tokyo_night]
surface = "#24283b"
fg = "#c0caf5"
muted = "#565f89"
blue = "#7aa2f7"
cyan = "#7dcfff"
green = "#9ece6a"
magenta = "#bb9af7"
red = "#f7768e"
yellow = "#e0af68"
orange = "#ff9e64"
purple = "#9d7cd8"
teal = "#73daca"


# --- Prompt ---
[character]
success_symbol = "[󱞪](bold cyan) "
error_symbol = "[󱞪](bold red) "
vimcmd_symbol = "[󰌌](bold green) "

# --- OS ---
[os]
disabled = false
style = "bold green"
format = "[$symbol]($style)"

[os.symbols]
Void = " "
Linux = "󰌽 "
Ubuntu = "󰕈 "
Arch = "󰣇 "
Debian = "󰣚 "
Fedora = "󰣛 "
Macos = "󰀵 "
Windows = "󰍲 "

# --- Container ---
[container]
style = "bold purple"
symbol = "󰏖 "
format = "[$symbol]($style) "

# --- Env ---
[env_var]
variable = "AWS_PROFILE"
format = "[](surface)[󰘊 $env_value](bold orange bg:surface)[](surface) "

# --- Directory ---
[directory]
style = "bold blue"
format = "[](surface)[󰉋 ](bold cyan bg:surface)[$path](bold fg bg:surface)[](surface) "
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"
read_only_style = "bold red bg:surface"
home_symbol = "~"
use_os_path_sep = true

# --- Git ---
[git_branch]
symbol = " "
style = "bold magenta"
format = "[](surface)[$symbol$branch](bold magenta bg:surface)[](surface) "
truncation_length = 28
truncation_symbol = "…"
[git_state]
style = "bold orange"
format = "[](surface)[$state( $progress_current/$progress_total)](bold orange bg:surface)[](surface) "
[git_status]
disabled = true

# --- Jobs ---
[jobs]
symbol = "✦ "
style = "bold orange bg:surface"
format = "[](surface)[$symbol$number](bold orange bg:surface)[](surface) "

# --- Duration ---
[cmd_duration]
min_time = 2000
show_milliseconds = false
format = "[](surface)[󱎫 $duration](bold yellow bg:surface)[](surface) "

# --- Status ---
[status]
disabled = false
format = "[](surface)[✘ $status](bold red bg:surface)[](surface) "

# --- Right prompt ---
[hostname]
ssh_only = true
trim_at = "."
style = "bold teal"
format = "[](surface)[󰘶 $hostname](bold teal bg:surface)[](surface) "
[username]
show_always = false
style_user = "bold yellow"
style_root = "bold red"
format = "[](surface)[$user](bold yellow bg:surface)[](surface) "
[time]
disabled = false
time_format = "%R"
format = "[](surface)[󱑎 $time](bold muted bg:surface)[](surface)"

# --- Toolchains ---
[golang]
symbol = " "
detect_files = ["go.mod", "go.sum", "go.work"]
format = "[](surface)[ $version](bold cyan bg:surface)[](surface) "
[python]
symbol = " "
detect_files = ["pyproject.toml", "requirements.txt", "setup.py", ".python-version", "Pipfile"]
format = "[](surface)[ $version( $virtualenv)](bold yellow bg:surface)[](surface) "
[nodejs]
symbol = "󰎙 "
detect_files = ["package.json", ".nvmrc", "pnpm-lock.yaml", "yarn.lock", "bun.lockb"]
format = "[](surface)[󰎙 $version](bold green bg:surface)[](surface) "
[terraform]
style = "bold purple"
format = "[](surface)[󱁢 $workspace](bold purple bg:surface)[](surface) "
[kubernetes]
style = "bold blue"
format = "[](surface)[$context](bold blue bg:surface)[](surface) "

# --- Docker ---
[docker_context]
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "compose.yml", "compose.yaml", "Dockerfile"]
style = "bold blue"
format = "[](surface)[ $context](bold blue bg:surface)[](surface) "

